<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shoply - E-Commerce</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./Style/index.css">
    <link rel="stylesheet" href="./Style/cart.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            Shoply
        </div>

        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Categories</a>
            <a href="#">About</a>
        </nav>

        <div class="nav-icons">
            <button id="searchBtn" title="Search">⌕</button>
            <button id="userBtn" title="Account">♙</button>
            <button id="cartBtn" title="Cart">
                🛒
                <span id="cartCount">0</span>
            </button>
        </div>

    </header>


    <!-- ================= HERO SECTION ================= -->

    <main class="container">

      <div class="product-container">
        <div class="heading"><h1>Your cart</h1></div>
        <div class="result">

            <button class="remove-btn" title="Remove product">
                &times;
            </button>

            <div class="image-container">
                <img src="../E-Commerce/Assets/images/accessory1.jpeg" alt="">
            </div>
            <div class="proDetail">
                <h4 class="product-Name">Classic Black Leather Watch</h4>
                <h6 class="product-category">Acccessories</h6>
                <p class="originialPrize"> ₹2499</p>
            </div>
        </div>
      </div>
      <div class="productDetails">
        <h3>Order Summary</h3>
        <p>Product Prize : <span>₹1000</span> </p>
        <p>Total Discount : <span>₹500</span> </p>
        <p>Delivery Fee: Free</p>
        <hr>
        <p>Final Prize: <span>₹500</span></p>
        <button>Proceed to Checkout</button>
      </div>
    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-content">

            <div class="footer-brand">

                <h3>Shoply</h3>

                <p>
                    Everyday finding, thoughtfully chosen.
                </p>

                <div class="social-icons">
                    <span>f</span>
                    <span>𝕏</span>
                    <span>◎</span>
                </div>

            </div>

        </div>

        <div class="footer-bottom">
            <p>
                © 2026 Shoply. All rights reserved.
            </p>
        </div>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="./JS/data.js"></script>
    <script src="./JS/cart.js"></script>
    

</body>

</html>
