<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="parent-container">
    <h1>Simon Game</h1>
    <p>Click any button to  start the game</p>
  
    <div class="container">
      <div class="box red" id="red" type="button"></div>
      <div class="box blue" id="blue" type="button"></div>
      <div class="box orange" id="orange" type="button"></div>
      <div class="box green" id="green" type="button"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
